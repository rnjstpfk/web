<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비디오/오디오</title>
</head>

<body>
    <h2>비디오</h2>
    <video src="./media/myMovie.mp4" controls width="50%" autoplay muted></video>
    <iframe width="50%" src="https://www.youtube.com/embed/1hia962ucnc?si=-sMdio_YCKzOYDlX" title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <hr>
    <h2>오디오</h2>
    <audio src="./media/music.mp3" controls></audio>
    <embed src="./media/music.mp3">

    <hr>
    <h2>object</h2>
    <p>object로 pdf 가져오기</p>
    <object data="./media/생성형ai.pdf" width="900" height="800"></object>
</body>

</html>
