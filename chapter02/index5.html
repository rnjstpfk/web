<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{border-collapse: collapse; width: 100%;}
        th, td{border: 1px solid #000; padding: 10px; text-align: center;}
        th{background-color: #f2f2f2;}
        tr:nth-child(even){background-color: #f9f9f9;}
        tr:hover{background-color: #d1e7dd;}
        td:nth-child(1){background-color: #f8d7da;} /* 첫 번째 열 배경색 */
        td:nth-child(2){background-color: #d1ecf1;} /* 두 번째 열 배경색 */                 
        td:nth-child(3){background-color: #fff3cd;} /* 세 번째 열 배경색 */
        td:nth-child(4){background-color: #d4edda;} /* 네 번째 열 배경색 */
        </style>
</head>
<body>
    <table>
        <tr>
            <td>순위</td>
            <td>영화제목</td>
            <td>평점</td>
            <td>기타</td>
        </tr>
        <tr>
            <td>1</td>
            <td>어벤져스</td>
            <td>9.0</td>
            <td>액션</td>
        </tr>
        <tr>
            <td>2</td>
            <td>타이타닉</td>
            <td>8.5</td>
            <td>로맨스</td>
        </tr>
        <tr>
            <td>3</td>
            <td>인셉션</td>
            <td>8.8</td>
            <td>SF</td>
        </tr>           
        <tr>
            <td>4</td>
            <td>포레스트 검프</td>
            <td>8.7</td>
            <td>드라마</td>
        </tr>
        <tr>
            <td>5</td>
            <td>다크 나이트</td>
            <td>9.0</td>
            <td>액션</td>
    </table>
</body>
</html>
