<!DOCTYPE HTML>
<html>
	<head>
		<title> 히트 레시피 </title>
		<meta charset="UTF-8" />
		<style type="text/css">
		
				/* 전체 선택자 */

				/* body 선택자 */
		
				/* 하이퍼링크 디자인 */

				/* div 요소 디자인  */
				*{margin: 0; padding: 0;}
				h1{padding-left: 20px;}
				#categoryBox{border: 5px solid rgb(125, 210, 131); width: 200px; margin: 20px;}
				#bbsBox{border: 5px solid pink; width: 200px; margin: 20px;}
				a{color: silver; text-decoration: none; padding-left: 10px;}
				a:hover{color: cornflowerblue;}
				#categoryBox h1{border-bottom: 1px solid #000;}
				a[title]{background-color: green; }
				a[title*="레시피"]{
				background-color: rgb(140, 140, 59);
				}
				.bbsMenu a{padding: 2px; color: #ffffff;}
				a[title*="게시판"]{
				background-color: rgb(131, 97, 216); padding: 2px;
				}
				ul{list-style: none;
				margin: 5px 10px 10px 10px;}
				.cookMenu li:first-child a{font-weight: bold; color: #000;}	
		</style>
	</head>

	<body>
		<div id="categoryBox">
			<h1><img src="images/title_category.jpg" width="54" height="13" alt="카테고리" /></h1>
			<ul class="cookMenu"> 
				
				<li><a href="#">밥/죽/면</a></li>
				<li><a href="#">매일 반찬</a></li>
				<li><a href="#">국/찌게/전골</a></li>
				<li><a href="#">가족/초대요리</a></li>
				<li><a href="#">소스/양념장</a></li>
				<li><a href="#">간식/음료</a></li>
				<li><a href="#">기타</a></li>
			</ul>
		</div>
		<div id="bbsBox">
			<h1><img src="images/title_bbs.jpg" width="54" height="13" alt="게시판" /></h1>
			<ul class="bbsMenu">
				<li><a href="#" title="자유게시판">자유 게시판</a></li>
				<li><a href="#" title="회원장터">회원 장터</a></li>
				<li><a href="#" title="나만의 레시피">나만의 레시피</a></li>
				<li><a href="#" title="불후의 레시피">불후의 레시피</a></li>
			</ul>
		</div>
	</body>
</html>
