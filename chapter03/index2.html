<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
/*         fieldset{border: none;}
        legend{display: none;} */
    </style>
</head>
<body>
    <from action="#" method="post" name="" id="">
        <fieldset>
            <legend>폼욤소</legend>
            <p>
                <label for="text1">이름</label>
                <input type="text" id="tsxt1" placeholder="이름을 작성해주세요">
            
            </p>

            <label>비밀번호 <input type="password" placeholder="비밀번호를 작성해주세요"></label>
            <input type="submit" value="로그인">
            <div><input type="search"></div>
            <div><input type="url"></div>
            <div>
                <label for="userEmail">이메일</label>
                <input type="email" id="userEmail">
            </div>

            <p><input type="submit"></p>

            <div>
                <label for="phone">연락처</label>
                <input type="text" id="phone">
            </div>
            <label for="usernum">수량</label>
            <input type="number" id="usernum">
            <div>
                <input type="range">
            </div>
            <div>
                <input type="date">
            </div>
            <input type="reset">
            <input type="image" src="./images/btn_gallery.gif">
            <input type="button" value="전송">
            <p><input type="file"></p>
            <input type="hidden" >
        </fieldset>
    </from>
</body>
</html>
